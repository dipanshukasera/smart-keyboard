# Publishes the landing page (docs/) to GitHub Pages together with the latest
# release APK, so the page's Download button is a same-origin file: the
# browser downloads it directly instead of bouncing through github.com and
# its asset CDN. The APK is fetched at deploy time, never committed.
name: Deploy page

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the latest APK to the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern smart-keyboard.apk --dir docs --clobber
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
