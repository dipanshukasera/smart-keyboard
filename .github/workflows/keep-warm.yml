# Render's free tier puts the backend to sleep after ~15 minutes without
# traffic, and the first request afterwards takes 30-50 seconds. A ping every
# 10 minutes keeps it awake so GIF searches stay fast.
name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: curl -fsS --max-time 60 --retry 2 https://smart-keyboard-backend.onrender.com/health
